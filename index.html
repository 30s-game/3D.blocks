<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D 블록 코딩 에디터</title>
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; display: flex; height: 100vh; overflow: hidden; font-family: sans-serif; }
        #blocklyDiv { width: 50%; height: 100%; }
        #visualizer { width: 50%; height: 100%; position: relative; border-left: 2px solid #ccc; }
        #runButton { position: absolute; top: 10px; right: 10px; z-index: 10; padding: 10px 20px; 
                     background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; }
        #runButton:hover { background: #218838; }
    </style>
</head>
<body>

    <div id="blocklyDiv"></div>

    <div id="visualizer">
        <button id="runButton" onclick="runCode()">코드 실행</button>
    </div>

    <xml id="toolbox" style="display: none">
        <category name="움직임" colour="210">
            <block type="move_x"></block>
            <block type="rotate_y"></block>
        </category>
        <category name="색상" colour="20">
            <block type="change_color"></block>
        </category>
    </xml>

    <script>
        // --- 1. Three.js 환경 초기화 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);
        const camera = new THREE.PerspectiveCamera(75, (window.innerWidth/2) / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth / 2, window.innerHeight);
        document.getElementById('visualizer').appendChild(renderer.domElement);

        // 기본 조명 및 조작 대상(큐브) 생성
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 2).normalize();
        scene.add(light);

        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // --- 2. Blockly 커스텀 블록 정의 ---
        
        // X축 이동 블록
        Blockly.Blocks['move_x'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("X축으로")
                    .appendField(new Blockly.FieldNumber(0), "DISTANCE")
                    .appendField("만큼 이동");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour(210);
            }
        };

        // Y축 회전 블록
        Blockly.Blocks['rotate_y'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("Y축으로")
                    .appendField(new Blockly.FieldAngle(90), "ANGLE")
                    .appendField("도 회전");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour(210);
            }
        };

        // 색상 변경 블록
        Blockly.Blocks['change_color'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("색상을")
                    .appendField(new Blockly.FieldColor("#ff0000"), "COL")
                    .appendField("으로 변경");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour(20);
            }
        };

        // --- 3. 블록 -> JavaScript 변환 로직 ---
        const javascriptGenerator = Blockly.JavaScript;

        javascriptGenerator['move_x'] = function(block) {
            const distance = block.getFieldValue('DISTANCE');
            return `cube.position.x += ${distance};\n`;
        };

        javascriptGenerator['rotate_y'] = function(block) {
            const angle = block.getFieldValue('ANGLE');
            const rad = (angle * Math.PI) / 180;
            return `cube.rotation.y += ${rad};\n`;
        };

        javascriptGenerator['change_color'] = function(block) {
            const color = block.getFieldValue('COL');
            return `cube.material.color.set('${color}');\n`;
        };

        // --- 4. 워크스페이스 주입 및 실행 함수 ---
        const workspace = Blockly.inject('blocklyDiv', {
            toolbox: document.getElementById('toolbox'),
            scrollbars: true
        });

        function runCode() {
            // 모든 블록을 코드로 변환
            window.LoopTrap = 1000;
            javascriptGenerator.INFINITE_LOOP_TRAP = 'if (--window.LoopTrap == 0) throw "Infinite loop.";\n';
            const code = javascriptGenerator.workspaceToCode(workspace);
            
            try {
                // 생성된 문자열 코드를 실행
                eval(code);
            } catch (e) {
                alert("코드 실행 중 오류가 발생했습니다: " + e);
            }
        }
    </script>
</body>
</html>
